# Shared by research/sweep-probe.yaml. The same as base-a.yaml except for the corpus, which is the
# subset made by research/make_probe_corpus.py: the vectors that won against the unguarded target
# are removed and the corpus ends at jb-002.
target:
  provider: ollama
  base_url: http://localhost:11434
  model: qwen3:8b
  timeout: 300

judge:
  provider: ollama
  base_url: http://localhost:11434
  model: qwen3:14b
  timeout: 300

system_prompt_file: ../examples/target_system_prompt.txt
corpus_dir: ../out/research/probe-corpus
canary: NW-7f3a9c21-ZEPHYR
scoring: any

attacker:
  strategy: corpus
  objectives: [leak_canary]
  max_turns: 30
  judge_mode: on_suspicion
  max_history_turns: 8
  max_message_chars: 2000
