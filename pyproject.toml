[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cthulhu"
version = "0.2.0"
description = "Prompt injection and jailbreak testing for LLM applications you own."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cthulhu = "cthulhu.cli:main"
redteam = "cthulhu.cli:main"

[tool.setuptools.packages.find]
include = ["cthulhu*"]

[tool.setuptools.package-data]
cthulhu = ["corpus/data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
