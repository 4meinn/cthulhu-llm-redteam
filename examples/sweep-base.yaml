# The base config for examples/sweep.yaml. Everything a sweep does not vary comes from here.
# max_turns covers the whole corpus (29 attacks) so a campaign cell really tries every vector.
target:
  provider: mock          # mock | ollama | openai
  base_url: http://localhost:11434
  model: qwen3:8b
  # temperature: 0.7      # optional; left out, the model's own default sampling is used

judge:
  provider: mock
  base_url: http://localhost:11434
  model: qwen3:14b

system_prompt_file: target_system_prompt.txt
canary: NW-7f3a9c21-ZEPHYR

categories: []            # empty runs every category
scoring: any

attacker:
  strategy: corpus        # corpus | adaptive (adaptive needs the endpoint below)
  endpoint:
    provider: mock
    base_url: http://localhost:11434
    model: dolphin-llama3:8b
  objectives: [leak_canary]
  max_turns: 30
  judge_mode: on_suspicion
  max_history_turns: 8
  max_message_chars: 2000
