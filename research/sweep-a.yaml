# Part A: the attack success rates. 8 cells x 10 repeats = 80 runs, one local GPU so one worker.
# Run from the repository root:  research\run.ps1 .venv\Scripts\cthulhu.exe sweep --config research\sweep-a.yaml
name: research-a-asr
base: base-a.yaml
out: out/research/a
repeats: 10
workers: 1
grid:
  target: [ollama:qwen3:8b]
  guardrail: [none, input, output, both]    # input is the pattern filter plus hardening
  strategy: [corpus]
  objective: [leak_canary]
  mode: [isolated, campaign]
